<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AkaShiro AI — V10 Ultimate Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#E11D48', hover: '#BE123C', glow: '#FF3B5C', dim: 'rgba(225, 29, 72, 0.1)' },
                        dark: { bg: '#09090b', panel: '#121214', border: '#27272a', input: '#18181b', hover: '#1f1f22' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], orbitron: ['Orbitron', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    boxShadow: { 'neon': '0 0 20px rgba(225, 29, 72, 0.3)', 'panel': '0 8px 32px rgba(0,0,0,0.5)', 'float': '0 10px 40px rgba(0,0,0,0.8)' },
                    animation: { 'fade-in': 'fadeIn 0.2s ease-out forwards', 'slide-up': 'slideUp 0.3s cubic-bezier(0.2, 1, 0.3, 1) forwards', 'blink': 'blink 1s step-end infinite' },
                    keyframes: { 
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        blink: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0' } }
                    }
                }
            }
        }
    </script>

    <!-- Core Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Markdown, Sanitizer, Code Highlight -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- KaTeX for Advanced Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            background-color: #09090b; color: #f4f4f5;
            background-image: radial-gradient(circle at 10% 20%, rgba(225, 29, 72, 0.03), transparent 30%), radial-gradient(circle at 90% 80%, rgba(225, 29, 72, 0.03), transparent 30%);
            -webkit-tap-highlight-color: transparent; scroll-behavior: smooth;
        }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #E11D48; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* UI Adjustments */
        .glass-header { background: rgba(18, 18, 20, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-input { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.06); }
        
        /* Markdown Styling (V10 Ergonomics) */
        .markdown-body { font-size: 0.95rem; line-height: 1.65; color: #d4d4d8; word-wrap: break-word; }
        @media (max-width: 768px) { .markdown-body { font-size: 0.9rem; } }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-family: 'Inter', sans-serif; font-weight: 700; color: #fff; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body h1 { font-size: 1.4rem; border-bottom: 1px solid #27272a; padding-bottom: 0.3rem; }
        .markdown-body h2 { font-size: 1.2rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 1rem; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body a { color: #E11D48; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s ease; }
        .markdown-body a:hover { color: #FF3B5C; border-bottom-color: #FF3B5C; }
        .markdown-body strong { color: #f4f4f5; font-weight: 600; }
        .markdown-body blockquote { border-left: 3px solid #E11D48; background: rgba(225,29,72,0.05); padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 0 6px 6px 0; color: #a1a1aa; font-style: italic; }
        .markdown-body code:not(pre code) { background: rgba(255,255,255,0.08); padding: 0.15rem 0.35rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: #ff8fa3; }
        
        /* Table & Media */
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; border-radius: 8px; overflow: hidden; border: 1px solid #27272a; display: block; overflow-x: auto; }
        .markdown-body th, .markdown-body td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #27272a; white-space: nowrap; }
        .markdown-body th { background: rgba(255,255,255,0.02); color: #fff; font-weight: 600; font-size: 0.85em; text-transform: uppercase; }
        .markdown-body img { max-width: 100%; border-radius: 8px; margin: 1rem 0; border: 1px solid #27272a; }
        .markdown-body iframe, .markdown-body video { width: 100%; max-width: 600px; aspect-ratio: 16/9; border-radius: 8px; margin: 1rem 0; border: 1px solid #27272a; background: #000; }
        
        /* Stream Cursor */
        .stream-cursor::after { content: '▋'; display: inline-block; animation: blink 1s step-end infinite; color: #E11D48; margin-left: 4px; vertical-align: baseline; font-size: 1em; }
        .typing-dots { display: inline-flex; align-items: center; height: 20px; gap: 4px; }
        .typing-dots span { width: 6px; height: 6px; background-color: #E11D48; border-radius: 50%; animation: pulseDots 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulseDots { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

        /* Floating Utilities */
        #scrollBtn { opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(20px); }
        #scrollBtn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        /* Toast Container */
        #toastContainer { position: fixed; top: 1rem; right: 1rem; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast { pointer-events: auto; transform: translateX(120%); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body class="h-[100dvh] flex overflow-hidden text-zinc-100 selection:bg-brand selection:text-white font-sans antialiased">

    <!-- Toast Notifications (V10 System) -->
    <div id="toastContainer"></div>

    <!-- ==========================================
         LEFT SIDEBAR: NAVIGATION & HISTORY
         ========================================== -->
    <aside id="appSidebar" class="w-72 bg-dark-panel border-r border-dark-border flex flex-col shrink-0 transition-transform duration-300 ease-in-out absolute lg:relative z-50 h-full -translate-x-full lg:translate-x-0 shadow-[10px_0_30px_rgba(0,0,0,0.5)] lg:shadow-none">
        
        <!-- Sidebar Header -->
        <div class="h-16 flex items-center justify-between px-5 border-b border-dark-border shrink-0 bg-dark-bg/20">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-rose-900 flex items-center justify-center border border-brand/30 shadow-neon">
                    <span class="font-orbitron font-bold text-white text-sm">赤</span>
                </div>
                <div class="flex flex-col">
                    <span class="font-orbitron font-bold text-sm tracking-wide text-white">AkaShiro<span class="text-brand">.AI</span></span>
                    <span class="text-[9px] font-mono text-zinc-400 uppercase tracking-widest bg-zinc-800/40 px-1.5 py-0.5 rounded w-max mt-0.5 border border-zinc-700/50">V10 Ultimate</span>
                </div>
            </div>
            <button onclick="toggleSidebar(false)" class="lg:hidden w-8 h-8 flex items-center justify-center rounded-lg bg-dark-border/40 text-zinc-400 hover:text-white hover:bg-rose-900/50 transition-all">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Start New Chat Action -->
        <div class="p-4 shrink-0">
            <button onclick="startNewChat()" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-white text-black hover:bg-zinc-200 text-xs font-semibold tracking-wide transition-all shadow-[0_0_15px_rgba(255,255,255,0.15)] active:scale-[0.98]">
                <i class="fa-solid fa-plus text-[10px]"></i> SESI BARU
            </button>
        </div>

        <!-- Search & Chat History List -->
        <div class="px-4 py-1.5 flex flex-col gap-2 shrink-0">
            <div class="text-[9px] font-mono font-bold text-zinc-500 uppercase tracking-widest flex items-center gap-1.5">
                <i class="fa-solid fa-folder-open"></i> Riwayat Komputasi
            </div>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-zinc-500 text-[10px]"></i>
                <input type="text" id="searchHistory" oninput="handleSearchHistory(this.value)" placeholder="Cari transkrip..." class="w-full bg-dark-input border border-dark-border rounded-md pl-8 pr-3 py-1.5 text-[11px] text-zinc-200 focus:outline-none focus:border-zinc-500 transition-colors placeholder-zinc-600">
            </div>
        </div>
        <div id="chatHistoryList" class="flex-1 overflow-y-auto px-3 pb-3 mt-2 space-y-1 scroll-smooth no-scrollbar">
            <!-- List item injected by JS -->
        </div>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-dark-border bg-dark-bg/30 shrink-0 flex gap-2">
            <button onclick="clearAllChats()" class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-md bg-dark-panel hover:bg-rose-950/40 text-zinc-400 hover:text-rose-400 text-[10px] font-mono border border-dark-border hover:border-rose-900/80 transition-all group" title="Hapus Semua Riwayat">
                <i class="fa-solid fa-trash-can group-hover:scale-110 transition-transform"></i> Bersihkan
            </button>
            <button onclick="openModal('settingsModal')" class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-md bg-dark-panel hover:bg-zinc-800 text-zinc-300 hover:text-white text-[10px] font-mono border border-dark-border hover:border-zinc-600 transition-all group" title="Pengaturan Model">
                <i class="fa-solid fa-sliders group-hover:rotate-90 transition-transform duration-300"></i> API & Parameter
            </button>
        </div>
    </aside>

    <!-- Overlay for Mobile Sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden transition-opacity lg:hidden" onclick="toggleSidebar(false)"></div>

    <!-- ==========================================
         MAIN WORKSPACE: HEADER, CHAT & INPUT
         ========================================== -->
    <main class="flex-1 flex flex-col h-full relative min-w-0 bg-dark-bg">
        
        <!-- HEADER -->
        <header class="h-14 glass-header px-4 flex items-center justify-between z-30 shrink-0 sticky top-0">
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleSidebar(true)" class="lg:hidden w-8 h-8 flex items-center justify-center rounded-md bg-dark-input border border-dark-border text-zinc-400 hover:text-white hover:border-zinc-500 transition-all">
                    <i class="fa-solid fa-bars-staggered text-xs"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 text-zinc-300 text-xs font-medium border-l border-dark-border pl-3 lg:border-none lg:pl-0">
                    <i class="fa-solid fa-terminal text-[10px] text-brand"></i>
                    <span id="headerChatTitle" class="truncate max-w-[200px] font-mono text-zinc-400">Memuat Sesi...</span>
                </div>
            </div>

            <!-- Dynamic Model Selector & PDF Export -->
            <div class="flex items-center gap-2">
                <div class="relative flex items-center bg-dark-input border border-dark-border rounded-lg p-1 pr-2 hover:border-zinc-600 transition-colors shadow-sm group">
                    <div class="w-6 h-6 rounded bg-zinc-800/80 flex items-center justify-center text-brand shrink-0">
                        <i class="fa-solid fa-microchip text-[10px]"></i>
                    </div>
                    <select id="chatModelSelect" onchange="changeChatModel(this.value)" class="bg-transparent border-none text-zinc-200 text-[10px] md:text-xs font-mono focus:outline-none focus:ring-0 cursor-pointer w-28 md:w-44 appearance-none pl-2 pr-5 py-0.5 truncate z-10 relative outline-none">
                        <!-- Options populated by JS -->
                    </select>
                    <i class="fa-solid fa-chevron-down text-[9px] text-zinc-500 absolute right-2 pointer-events-none group-hover:text-zinc-300"></i>
                </div>
                
                <div class="flex bg-dark-input border border-dark-border rounded-lg p-0.5">
                    <button onclick="exportCurrentChat('markdown')" class="w-7 h-7 flex items-center justify-center rounded hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors" title="Export Markdown (.md)">
                        <i class="fa-brands fa-markdown text-xs"></i>
                    </button>
                    <button onclick="window.print()" class="w-7 h-7 flex items-center justify-center rounded hover:bg-zinc-800 text-zinc-400 hover:text-emerald-400 transition-colors" title="Cetak / Simpan PDF">
                        <i class="fa-solid fa-print text-xs"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- CHAT SCROLL AREA -->
        <div id="chatScrollArea" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col scroll-smooth relative" onscroll="handleScroll()">
            
            <!-- Hero / Empty State -->
            <div id="welcomeHero" class="max-w-2xl mx-auto my-auto py-4 w-full animate-fade-in flex flex-col items-center justify-center text-center">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-dark-input to-dark-bg border border-zinc-700/50 flex items-center justify-center mb-6 shadow-panel relative group">
                    <div class="absolute inset-0 bg-brand/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <i class="fa-solid fa-bolt-lightning text-3xl text-zinc-200 relative z-10"></i>
                </div>
                <h2 class="text-xl md:text-2xl font-orbitron font-bold text-white mb-2">Sistem V10 Aktif.</h2>
                <p class="text-zinc-400 text-[12px] md:text-[13px] max-w-md mx-auto leading-relaxed mb-8">Dilengkapi fitur <b>Streaming Real-Time</b>, proteksi Memori Konteks, dan rendering Eksekusi Kode presisi tingkat tinggi.</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-lg">
                    <button onclick="sendQuickPrompt('Tuliskan fungsi JavaScript yang mengimplementasikan algoritma QuickSort beserta penjelasannya.')" class="p-3.5 rounded-xl bg-dark-input border border-dark-border hover:border-brand/40 hover:shadow-neon transition-all text-left group">
                        <i class="fa-brands fa-js text-yellow-400 mb-2 block text-base group-hover:scale-110 transition-transform origin-left"></i>
                        <span class="text-zinc-200 text-[12px] font-semibold block mb-0.5">Generate Algoritma (JS)</span>
                        <span class="text-zinc-500 text-[9px] font-mono">Uji kecepatan Streaming Response.</span>
                    </button>
                    <button onclick="sendQuickPrompt('Buatkan template HTML lengkap dengan CSS Grid untuk layout Dashboard Admin minimalis.')" class="p-3.5 rounded-xl bg-dark-input border border-dark-border hover:border-brand/40 hover:shadow-neon transition-all text-left group">
                        <i class="fa-brands fa-html5 text-orange-500 mb-2 block text-base group-hover:scale-110 transition-transform origin-left"></i>
                        <span class="text-zinc-200 text-[12px] font-semibold block mb-0.5">Design UI Dashboard</span>
                        <span class="text-zinc-500 text-[9px] font-mono">Penulisan struktur kode kompleks.</span>
                    </button>
                    <button onclick="sendQuickPrompt('Jelaskan teori Fisika Kuantum menggunakan rumus Probabilitas matematika (gunakan syntax LaTeX).')" class="p-3.5 rounded-xl bg-dark-input border border-dark-border hover:border-brand/40 hover:shadow-neon transition-all text-left sm:col-span-2 group flex items-center justify-between">
                        <div>
                            <i class="fa-solid fa-atom text-cyan-400 mb-1.5 block text-base"></i>
                            <span class="text-zinc-200 text-[12px] font-semibold block">Render Matematika (KaTeX)</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-zinc-600 group-hover:text-brand transition-colors mr-2"></i>
                    </button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="chatMessagesList" class="flex flex-col space-y-6 w-full max-w-4xl mx-auto pb-6">
                <!-- Messages appended here dynamically -->
            </div>
            
            <div class="h-28 shrink-0"></div> <!-- Floating Input Spacer -->
        </div>

        <!-- Floating Scroll to Bottom Button -->
        <button id="scrollBtn" onclick="forceScrollBottom()" class="absolute bottom-[100px] right-4 md:right-8 w-9 h-9 rounded-full bg-dark-input border border-dark-border text-zinc-400 hover:text-white hover:border-brand shadow-float flex items-center justify-center z-20">
            <i class="fa-solid fa-arrow-down text-xs"></i>
        </button>

        <!-- INPUT AREA -->
        <div class="absolute bottom-0 left-0 right-0 p-3 md:p-5 bg-gradient-to-t from-dark-bg via-dark-bg/95 to-transparent z-30 pointer-events-none">
            <form id="chatForm" onsubmit="handleChatSubmit(event)" class="max-w-4xl mx-auto flex flex-col relative pointer-events-auto">
                <!-- Input Box -->
                <div class="glass-input rounded-2xl p-1.5 flex items-end shadow-panel transition-all duration-300 focus-within:border-brand/60 focus-within:shadow-neon relative">
                    <textarea id="chatInput" rows="1" placeholder="Masukkan instruksi sistem... (Shift+Enter: Baris Baru)" class="flex-1 bg-transparent border-none text-[13px] md:text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-0 resize-none max-h-[200px] min-h-[44px] px-4 py-3 no-scrollbar leading-relaxed font-sans" onkeydown="handleInputKeydown(event)" oninput="handleInputAutoResize(event)"></textarea>
                    
                    <div class="flex items-center gap-1.5 p-1 shrink-0">
                        <button type="button" id="voiceBtn" class="hidden sm:flex h-9 w-9 rounded-xl bg-transparent text-zinc-500 hover:text-zinc-300 transition-colors items-center justify-center" title="Voice Input (Segera Hadir)">
                            <i class="fa-solid fa-microphone text-sm"></i>
                        </button>
                        <button type="button" id="stopBtn" onclick="abortGeneration()" class="hidden h-9 w-9 rounded-xl bg-zinc-800 hover:bg-rose-900/40 text-rose-400 border border-zinc-700 hover:border-rose-500/50 transition-all items-center justify-center shadow-sm" title="Hentikan Proses">
                            <i class="fa-solid fa-square text-xs"></i>
                        </button>
                        <button type="submit" id="sendBtn" class="h-9 w-9 flex items-center justify-center rounded-xl bg-white text-black hover:bg-zinc-200 transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)] active:scale-[0.85] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Footer Info -->
                <div class="flex justify-between items-center px-3 mt-2 text-[9px] font-mono text-zinc-500 select-none hidden md:flex">
                    <span id="charCount" class="bg-dark-panel border border-dark-border px-1.5 py-0.5 rounded text-zinc-400">0 chars</span>
                    <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-500/80"></i> AkaShiro Secure Execution</span>
                </div>
            </form>
        </div>
    </main>

    <!-- ==========================================
         MODAL: SETTINGS & API CONFIGURATION
         ========================================== -->
    <div id="settingsModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="w-full max-w-lg bg-dark-panel rounded-2xl border border-dark-border shadow-[0_20px_60px_rgba(0,0,0,0.8)] transform scale-95 opacity-0 transition-all duration-300" id="settingsModalContent">
            
            <div class="flex items-center justify-between p-5 border-b border-dark-border bg-dark-input/50 rounded-t-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center text-brand">
                        <i class="fa-solid fa-microchip text-sm"></i>
                    </div>
                    <div>
                        <h3 class="font-orbitron font-bold text-sm text-white">Konfigurasi Engine V10</h3>
                    </div>
                </div>
                <button onclick="closeModal('settingsModal')" class="w-8 h-8 flex items-center justify-center rounded-lg text-zinc-400 hover:text-white transition-colors border border-transparent hover:border-zinc-700 hover:bg-zinc-800">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="p-5 space-y-5 text-[11px] font-mono max-h-[70vh] overflow-y-auto no-scrollbar">
                <div class="space-y-1.5">
                    <label class="text-zinc-300 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-globe text-brand"></i> API Endpoint</label>
                    <input type="text" id="customBaseUrl" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2.5 text-zinc-200 focus:outline-none focus:border-brand focus:shadow-neon transition-all">
                </div>

                <div class="space-y-1.5">
                    <label class="text-zinc-300 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-key text-amber-400"></i> Bearer Token / API Key</label>
                    <input type="password" id="customApiKey" class="w-full bg-dark-input border border-dark-border rounded-lg px-3 py-2.5 text-zinc-200 focus:outline-none focus:border-brand focus:shadow-neon transition-all tracking-[0.2em]">
                </div>

                <div class="bg-dark-input p-4 rounded-xl border border-dark-border space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-zinc-300 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-temperature-half text-cyan-400"></i> Temperature</label>
                        <span id="tempVal" class="text-white font-bold bg-dark-panel px-2 py-0.5 rounded border border-dark-border text-[10px]">0.7</span>
                    </div>
                    <input type="range" id="tempSlider" min="0" max="1" step="0.1" value="0.7" oninput="document.getElementById('tempVal').innerText = this.value" class="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-brand">
                    <div class="flex justify-between text-[9px] text-zinc-500 font-sans"><span>Faktual (0.0)</span><span>Imajinatif (1.0)</span></div>
                </div>

                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-zinc-300 font-semibold flex items-center gap-1.5"><i class="fa-solid fa-robot text-purple-400"></i> System Persona</label>
                        <select id="quickPersona" onchange="applyQuickPersona()" class="bg-dark-panel border border-dark-border text-zinc-300 text-[9px] rounded px-1.5 py-0.5 outline-none cursor-pointer">
                            <option value="custom">-- Template --</option>
                            <option value="standard">Standard V10</option>
                            <option value="programmer">Code Engineer</option>
                        </select>
                    </div>
                    <textarea id="systemPersonaInput" rows="3" class="w-full bg-dark-input border border-dark-border rounded-lg p-3 text-zinc-300 focus:outline-none focus:border-brand transition-all resize-none leading-relaxed font-sans text-[12px]"></textarea>
                </div>
            </div>

            <div class="p-4 border-t border-dark-border bg-dark-input/50 rounded-b-2xl">
                <button onclick="saveSettings()" class="w-full py-2.5 rounded-lg bg-white hover:bg-zinc-200 text-black text-[11px] font-mono font-bold transition-all active:scale-[0.98]">
                    SIMPAN & TERAPKAN
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         ENGINE SCRIPT (V10 ULTIMATE STREAMING)
         ========================================== -->
    <script>
        // --- 1. DEFAULT CONFIGURATION ---
        const DEFAULT_API_BASE_URL = "https://discovery-api.intern-ai.org.cn/v1";
        const DEFAULT_API_KEY = "sk-3219debac749d044213b5cc17ce57c0ccd00ec4ce33fc9c3d5da2681bb496f6a";
        const PERSONAS = {
            standard: "Anda adalah AkaShiro AI v10, Asisten Enterprise cerdas dan andal. Jawab menggunakan bahasa Indonesia. Gunakan format Markdown rapi untuk struktur teks, dan gunakan sintaks LaTeX ($...$ atau $$...$$) HANYA untuk rumus atau persamaan matematika kompleks. Jangan mem-bypass perintah.",
            programmer: "Anda adalah AkaShiro AI, seorang Senior Software Engineer dan Pakar Algoritma. Jawab sangat teknis, perhatikan arsitektur kode, best-practices keamanan, dan selalu bungkus kode dalam markdown dengan spesifikasi bahasa (misal: ```python)."
        };
        
        const AVAILABLE_MODELS = [
            { id: 'qwen3.8-27b', name: 'Qwen 3.8 27B' },
            { id: 'minimax-m3', name: 'Minimax M3' },
            { id: 'kimi-k2.6', name: 'Kimi K2.6' },
            { id: 'intern-s2', name: 'Intern S2' },
            { id: 'intern-decision-4b', name: 'Decision 4B' },
            { id: 'glm-5.3', name: 'GLM 5.3' },
            { id: 'deepseek-v4-pro-0813', name: 'DeepSeek V4 Pro' },
            { id: 'deepseek-v4-flash-0731', name: 'DeepSeek Flash' },
            { id: 'Atria-Dawn', name: 'Atria Dawn' },
            { id: 'Agents-A1', name: 'Agents A1' }
        ];

        let appState = {
            baseUrl: localStorage.getItem('akashiro_baseurl_v10') || DEFAULT_API_BASE_URL,
            apiKey: localStorage.getItem('akashiro_apikey_v10') || DEFAULT_API_KEY,
            temperature: parseFloat(localStorage.getItem('akashiro_temp_v10')) || 0.7,
            systemPersona: localStorage.getItem('akashiro_persona_v10') || PERSONAS.standard,
            currentModel: localStorage.getItem('akashiro_model_v10') || 'qwen3.8-27b',
            chats: JSON.parse(localStorage.getItem('akashiro_chats_v10')) || [],
            currentChatId: null
        };

        let currentAbortController = null;
        let isGenerating = false;
        let isAutoScrolling = true;

        // --- 2. INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            setupDOMBindings();
            setupMarkedRenderer();
            populateModelDropdown();
            
            if (appState.chats.length > 0) { loadChatSession(appState.chats[0].id); } 
            else { startNewChat(); }
        });

        function setupDOMBindings() {
            document.getElementById('customBaseUrl').value = appState.baseUrl;
            document.getElementById('customApiKey').value = appState.apiKey;
            document.getElementById('tempSlider').value = appState.temperature;
            document.getElementById('tempVal').innerText = appState.temperature;
            document.getElementById('systemPersonaInput').value = appState.systemPersona;
        }
        
        function applyQuickPersona() {
            const val = document.getElementById('quickPersona').value;
            if(PERSONAS[val]) document.getElementById('systemPersonaInput').value = PERSONAS[val];
        }

        function populateModelDropdown() {
            const select = document.getElementById('chatModelSelect');
            if(!select) return;
            select.innerHTML = '';
            AVAILABLE_MODELS.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id; opt.textContent = m.name;
                if(m.id === appState.currentModel) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function changeChatModel(val) {
            appState.currentModel = val; localStorage.setItem('akashiro_model_v10', val);
            let chat = getCurrentChat(); if(chat) { chat.model = val; saveChatsToStorage(); }
        }

        function toggleSidebar(show) {
            const sidebar = document.getElementById('appSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            if (show) { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); } 
            else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
        }

        // --- 3. TOAST SYSTEM (V10) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            
            const toast = document.createElement('div');
            let iconStr = '<i class="fa-solid fa-circle-info text-blue-400"></i>';
            let bgClass = 'bg-blue-950/90 border-blue-500/50';
            
            if(type === 'error') { iconStr = '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>'; bgClass = 'bg-rose-950/90 border-rose-500/50'; }
            if(type === 'success') { iconStr = '<i class="fa-solid fa-check-circle text-emerald-400"></i>'; bgClass = 'bg-emerald-950/90 border-emerald-500/50'; }

            toast.className = `toast flex items-center gap-3 px-4 py-2.5 rounded-xl border ${bgClass} text-zinc-200 text-xs font-mono shadow-panel backdrop-blur-xl max-w-sm`;
            toast.innerHTML = `<div class="shrink-0 text-sm">${iconStr}</div> <div class="leading-relaxed break-words">${message}</div>`;
            
            container.appendChild(toast);
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 400);
            }, 4000);
        }

        // --- 4. MARKDOWN, MEDIA & MATH (V10) ---
        function setupMarkedRenderer() {
            try {
                if (typeof marked === 'undefined') return;
                const renderer = new marked.Renderer();
                
                renderer.code = function(code, language) {
                    const validLang = !!(language && typeof hljs !== 'undefined' && hljs.getLanguage(language));
                    const highlighted = validLang ? hljs.highlight(code, { language }).value : escapeHtml(code);
                    const langName = language ? language.toUpperCase() : 'TEXT';
                    
                    return `
                    <div class="my-4 rounded-xl border border-dark-border bg-[#0d1117] overflow-hidden shadow-panel group/code">
                        <div class="flex justify-between items-center px-4 py-2 bg-dark-input border-b border-dark-border">
                            <span class="text-[10px] text-zinc-300 font-mono font-bold tracking-widest">${langName}</span>
                            <button type="button" class="text-[10px] text-zinc-400 hover:text-white transition-all flex items-center gap-1.5 bg-dark-bg hover:bg-zinc-700 px-2.5 py-1 rounded border border-dark-border" onclick="copyCodeBlock(this)">
                                <i class="fa-regular fa-copy"></i> <span>Copy</span>
                            </button>
                        </div>
                        <div class="overflow-x-auto p-4 text-[12px] md:text-[13px] font-mono no-scrollbar">
                            <pre class="m-0"><code class="hljs ${language || ''}">${highlighted}</code></pre>
                        </div>
                    </div>`;
                };

                renderer.link = function(href, title, text) {
                    if(href.includes('[youtube.com/watch](https://youtube.com/watch)') || href.includes('youtu.be/')) {
                        let videoId = href.split('v=')[1] || href.split('youtu.be/')[1];
                        if(videoId) videoId = videoId.split('&')[0];
                        return `<div class="my-4 w-full max-w-[500px] rounded-lg overflow-hidden border border-dark-border shadow-panel"><iframe src="[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){videoId}" frameborder="0" allowfullscreen class="w-full aspect-video bg-black"></iframe><div class="bg-dark-input px-3 py-1.5 text-[10px] text-zinc-400 font-mono border-t border-dark-border flex justify-between"><span class="truncate">Video Player</span><a href="${href}" target="_blank" class="text-brand hover:text-white ml-2 shrink-0">Buka <i class="fa-solid fa-external-link-alt text-[9px]"></i></a></div></div>`;
                    }
                    return `<a href="${href}" target="_blank" rel="noopener noreferrer" title="${title || ''}">${text}</a>`;
                };
                marked.setOptions({ renderer: renderer, breaks: true });
            } catch(e) { console.error("Markdown init error:", e); }
        }

        function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        window.copyCodeBlock = async function(btn) {
            try {
                const codeEl = btn.closest('.group\\/code').querySelector('code');
                if(codeEl) {
                    await navigator.clipboard.writeText(codeEl.innerText);
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> <span class="text-emerald-400">Copied!</span>';
                    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
                }
            } catch(e) {}
        }

        window.copyAiMessage = async function(msgIndex) {
            try {
                let chat = getCurrentChat();
                if(chat && chat.messages[msgIndex]) {
                    await navigator.clipboard.writeText(chat.messages[msgIndex].text);
                    showToast("Teks berhasil disalin ke clipboard.", "success");
                }
            } catch(e) {}
        }
        
        window.editUserMessage = function(msgIndex) {
            let chat = getCurrentChat();
            if(!chat || !chat.messages[msgIndex] || isGenerating) return;
            
            const originalText = chat.messages[msgIndex].text;
            document.getElementById('chatInput').value = originalText;
            
            // Hapus pesan ini dan semua pesan setelahnya (AI responses)
            chat.messages = chat.messages.slice(0, msgIndex);
            saveChatsToStorage();
            renderMessages();
            document.getElementById('chatInput').focus();
        }

        window.regenerateResponse = function() {
            if(isGenerating) return;
            let chat = getCurrentChat();
            if(!chat || chat.messages.length < 2) return;
            while(chat.messages.length > 0 && chat.messages[chat.messages.length-1].role !== 'user') { chat.messages.pop(); }
            if(chat.messages.length === 0) return;
            handleChatSubmit(null, true);
        }

        // --- 5. CORE CHAT LOGIC ---
        function startNewChat() {
            if(isGenerating) abortGeneration();
            const newChat = { id: 'chat_' + Date.now(), title: 'Sesi Komputasi Baru', messages: [], model: appState.currentModel, updatedAt: new Date().toISOString() };
            appState.chats.unshift(newChat); appState.currentChatId = newChat.id;
            saveChatsToStorage(); renderChatHistory(); renderMessages(); updateHeaderTitle();
            if(window.innerWidth < 1024) toggleSidebar(false);
        }

        function loadChatSession(chatId) {
            if(isGenerating) abortGeneration();
            appState.currentChatId = chatId; const chat = getCurrentChat();
            if(chat && chat.model) {
                appState.currentModel = chat.model; const select = document.getElementById('chatModelSelect'); if(select) select.value = chat.model;
            }
            renderChatHistory(); renderMessages(); updateHeaderTitle();
            if (window.innerWidth < 1024) toggleSidebar(false);
        }

        function getCurrentChat() { return appState.chats.find(c => c.id === appState.currentChatId); }

        function updateHeaderTitle() {
            const chat = getCurrentChat(); const titleEl = document.getElementById('headerChatTitle');
            if(titleEl && chat) titleEl.innerText = chat.title;
        }
        
        function handleSearchHistory(query) { renderChatHistory(query.toLowerCase()); }

        function renderChatHistory(filter = '') {
            const listEl = document.getElementById('chatHistoryList'); if (!listEl) return;
            listEl.innerHTML = '';
            const filteredChats = appState.chats.filter(c => c.title.toLowerCase().includes(filter));
            
            filteredChats.forEach(chat => {
                const isActive = chat.id === appState.currentChatId;
                const activeClass = isActive ? 'bg-dark-input border-l-2 border-brand text-white shadow-sm' : 'hover:bg-zinc-900 border-l-2 border-transparent text-zinc-400 hover:text-zinc-200';
                
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-r-lg text-[11px] font-mono transition-all flex items-center justify-between group cursor-pointer ${activeClass}`;
                item.onclick = () => loadChatSession(chat.id);
                item.innerHTML = `
                    <div class="flex items-center gap-2.5 w-[85%]"><i class="fa-regular fa-message text-[10px] ${isActive ? 'text-brand' : 'text-zinc-600'} shrink-0"></i><span class="truncate">${escapeHtml(chat.title)}</span></div>
                    <button onclick="deleteChatSession(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1.5 rounded bg-dark-bg text-zinc-500 hover:text-rose-400 hover:bg-rose-950/50 transition-colors shrink-0"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                `;
                listEl.appendChild(item);
            });
        }

        // Smart Scroll
        function handleScroll() {
            const scrollArea = document.getElementById('chatScrollArea'); const scrollBtn = document.getElementById('scrollBtn');
            if(!scrollArea || !scrollBtn) return;
            const isAtBottom = scrollArea.scrollHeight - scrollArea.scrollTop <= scrollArea.clientHeight + 150;
            isAutoScrolling = isAtBottom;
            if(!isAtBottom) { scrollBtn.classList.add('visible'); } else { scrollBtn.classList.remove('visible'); }
        }
        
        function forceScrollBottom() {
            const scrollArea = document.getElementById('chatScrollArea');
            if(scrollArea) { scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' }); }
        }

        function scrollToBottom() {
            const scrollArea = document.getElementById('chatScrollArea'); if (!scrollArea) return;
            if (isAutoScrolling) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
        }

        // Render Individual Message HTML (To be used by full render and streaming update)
        function generateMessageHTML(msg, index, isLastMsg) {
            const isUser = msg.role === 'user';
            
            if (isUser) {
                return `
                <div class="flex justify-end w-full animate-slide-up opacity-0" id="msg-${index}">
                    <div class="group flex flex-col items-end max-w-[90%] sm:max-w-[75%]">
                        <div class="rounded-[1.25rem] rounded-tr-sm bg-zinc-800 text-zinc-100 px-5 py-3.5 shadow-panel text-[13px] md:text-sm leading-relaxed border border-zinc-700/80 break-words w-full">
                            <p class="whitespace-pre-wrap font-sans m-0">${escapeHtml(msg.text)}</p>
                        </div>
                        <div class="mt-1 mr-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editUserMessage(${index})" class="text-[9px] font-mono text-zinc-500 hover:text-brand bg-dark-panel px-2 py-0.5 rounded border border-dark-border"><i class="fa-solid fa-pen mr-1"></i> Edit Prompt</button>
                        </div>
                    </div>
                </div>`;
            } else {
                let rawHtml = escapeHtml(msg.text || '');
                try { if(typeof marked !== 'undefined') rawHtml = marked.parse(msg.text || ''); } catch(e){}
                
                let safeHtml = rawHtml;
                try { 
                    if(typeof DOMPurify !== 'undefined') {
                        safeHtml = DOMPurify.sanitize(rawHtml, { ADD_TAGS: ['img', 'iframe', 'video', 'audio', 'source'], ADD_ATTR: ['target', 'src', 'alt', 'allow', 'allowfullscreen', 'frameborder', 'controls', 'class'] }); 
                    }
                } catch(e){}
                
                const isError = (msg.text || '').includes('⚠️');
                const streamClass = msg.isTyping && msg.text.length > 0 ? 'stream-cursor' : '';
                
                return `
                <div class="flex gap-3 md:gap-4 w-full max-w-[100%] sm:max-w-[95%] group/msg animate-slide-up opacity-0" id="msg-${index}">
                    <div class="w-8 h-8 md:w-9 md:h-9 rounded-[10px] bg-gradient-to-br from-brand to-rose-900 border border-brand/40 flex items-center justify-center text-white text-[11px] md:text-xs font-orbitron font-bold shrink-0 shadow-neon mt-1">赤</div>
                    <div class="flex-1 min-w-0">
                        <div class="rounded-[1.25rem] rounded-tl-sm px-4 md:px-5 py-4 text-[13px] md:text-sm text-zinc-200 markdown-body bg-dark-panel border border-dark-border shadow-panel ${isError ? 'border-rose-900/50 bg-rose-950/20' : ''} ${streamClass}">
                            ${msg.isTyping && msg.text.length === 0 ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : safeHtml}
                        </div>
                        
                        ${!msg.isTyping && !isError ? `
                        <div class="mt-2 ml-2 flex flex-wrap items-center gap-2 opacity-0 group-hover/msg:opacity-100 transition-opacity duration-300">
                            <button type="button" onclick="copyAiMessage(${index})" class="text-[9px] font-mono text-zinc-400 hover:text-white flex items-center gap-1.5 transition-colors bg-dark-panel border border-dark-border px-2 py-1 rounded shadow-sm hover:bg-zinc-800">
                                <i class="fa-regular fa-copy"></i> Salin
                            </button>
                            ${isLastMsg ? `
                            <button type="button" onclick="regenerateResponse()" class="text-[9px] font-mono text-zinc-400 hover:text-brand flex items-center gap-1.5 transition-colors bg-dark-panel border border-dark-border px-2 py-1 rounded shadow-sm hover:border-brand/30 hover:bg-brand/5">
                                <i class="fa-solid fa-rotate-right"></i> Regenerate
                            </button>` : ''}
                        </div>` : ''}
                    </div>
                </div>`;
            }
        }

        function renderMessages() {
            const chat = getCurrentChat();
            const listContainer = document.getElementById('chatMessagesList');
            const welcomeHero = document.getElementById('welcomeHero');

            if (!listContainer) return; 
            if (!chat || chat.messages.length === 0) {
                listContainer.innerHTML = ''; if (welcomeHero) welcomeHero.classList.remove('hidden'); return;
            }
            if (welcomeHero) welcomeHero.classList.add('hidden');
            
            listContainer.innerHTML = '';
            chat.messages.forEach((msg, index) => {
                const isLast = index === chat.messages.length - 1;
                listContainer.insertAdjacentHTML('beforeend', generateMessageHTML(msg, index, isLast));
                
                // KaTeX Rendering (Delayed to ensure DOM is ready)
                if(msg.role !== 'user' && !msg.isTyping && typeof renderMathInElement !== 'undefined') {
                    const node = document.getElementById(`msg-${index}`);
                    if(node) {
                        try {
                            renderMathInElement(node, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '[', right: ']', display: true} ], throwOnError: false });
                        } catch(e) {}
                    }
                }
            });
            scrollToBottom();
        }
        
        // Fast Update for Streaming
        function updateLastMessageUI() {
            const chat = getCurrentChat();
            if(!chat || chat.messages.length === 0) return;
            const index = chat.messages.length - 1;
            const msg = chat.messages[index];
            const node = document.getElementById(`msg-${index}`);
            
            if(node) {
                const isError = (msg.text || '').includes('⚠️');
                const streamClass = msg.isTyping && msg.text.length > 0 ? 'stream-cursor' : '';
                
                let rawHtml = escapeHtml(msg.text || '');
                try { if(typeof marked !== 'undefined') rawHtml = marked.parse(msg.text || ''); } catch(e){}
                let safeHtml = rawHtml;
                try { if(typeof DOMPurify !== 'undefined') safeHtml = DOMPurify.sanitize(rawHtml, { ADD_TAGS: ['img', 'iframe', 'video', 'audio', 'source'], ADD_ATTR: ['target', 'src', 'alt', 'allow', 'allowfullscreen', 'frameborder', 'controls', 'class'] }); } catch(e){}
                
                const markdownBody = node.querySelector('.markdown-body');
                if(markdownBody) {
                    markdownBody.innerHTML = (msg.isTyping && msg.text.length === 0) ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : safeHtml;
                    
                    if(msg.isTyping && msg.text.length > 0) markdownBody.classList.add('stream-cursor');
                    else markdownBody.classList.remove('stream-cursor');
                }
                
                // Render Math real-time ONLY if not typing to save CPU
                if(!msg.isTyping && typeof renderMathInElement !== 'undefined') {
                    try { renderMathInElement(node, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '[', right: ']', display: true} ], throwOnError: false }); } catch(e) {}
                }
            }
            scrollToBottom();
        }

        // --- 6. NETWORK & STREAMING PROCESS (V10) ---
        function sendQuickPrompt(promptText) {
            const inputEl = document.getElementById('chatInput');
            if (inputEl) { inputEl.value = promptText; handleInputAutoResize({target: inputEl}); }
            handleChatSubmit(new Event('submit'));
        }

        function abortGeneration() {
            if(currentAbortController) { currentAbortController.abort(); currentAbortController = null; }
            toggleInputState(false);
            
            let chat = getCurrentChat();
            if(chat && chat.messages.length > 0) {
                const lastMsg = chat.messages[chat.messages.length-1];
                if(lastMsg.isTyping) {
                    lastMsg.isTyping = false;
                    if(lastMsg.text.length === 0) lastMsg.text = "*(Proses dibatalkan)*";
                    saveChatsToStorage(); updateLastMessageUI(); renderMessages(); // Full render to show action bar
                }
            }
        }

        function toggleInputState(generating) {
            isGenerating = generating;
            const btn = document.getElementById('sendBtn'); const stopBtn = document.getElementById('stopBtn'); const input = document.getElementById('chatInput');
            if(!btn || !stopBtn || !input) return;
            
            if(generating) {
                btn.classList.add('hidden'); stopBtn.classList.remove('hidden');
                input.disabled = true; input.classList.add('opacity-50');
            } else {
                btn.classList.remove('hidden'); stopBtn.classList.add('hidden');
                input.disabled = false; input.classList.remove('opacity-50'); input.focus();
            }
        }

        async function handleChatSubmit(e, isRegenerate = false) {
            if (e) e.preventDefault();
            if (isGenerating) return;

            const inputEl = document.getElementById('chatInput');
            const charCountEl = document.getElementById('charCount');
            if (!inputEl) return;
            
            let prompt = "";
            if(!isRegenerate) {
                prompt = inputEl.value.trim();
                if (!prompt) return;
            }

            if (!appState.baseUrl || !appState.apiKey) { 
                showToast("Konfigurasi API belum diatur!", "error"); openModal('settingsModal'); return; 
            }

            let chat = getCurrentChat();
            if (!chat) { startNewChat(); chat = getCurrentChat(); }
            
            if (!isRegenerate) {
                if (chat.messages.length === 0) {
                    chat.title = prompt.length > 25 ? prompt.substring(0, 25) + '...' : prompt;
                    updateHeaderTitle(); renderChatHistory();
                }
                chat.messages.push({ role: 'user', text: prompt, timestamp: new Date().toISOString() });
            }
            
            inputEl.value = ''; inputEl.style.height = 'auto'; 
            if (charCountEl) charCountEl.innerText = '0 chars'; 
            
            const loadingMsgIndex = chat.messages.length;
            chat.messages.push({ role: 'model', text: '', isTyping: true, timestamp: new Date().toISOString() });
            renderMessages(); forceScrollBottom();
            
            toggleInputState(true);
            currentAbortController = new AbortController();

            try {
                // Konteks Memori Pintar: Ambil maksimal 12 pesan terakhir agar tidak over-token
                let contextMessages = chat.messages.slice(0, -1);
                if(contextMessages.length > 12) {
                    contextMessages = contextMessages.slice(contextMessages.length - 12);
                }
                
                await callAIAPI_Stream(contextMessages, currentAbortController.signal, loadingMsgIndex);
                saveChatsToStorage();
            } catch (err) {
                if (err.name === 'AbortError') return; 
                console.error("API Fetch Error:", err);
                chat.messages[loadingMsgIndex].isTyping = false;
                chat.messages[loadingMsgIndex].text = `⚠️ **Gateway Error:** \`${err.message}\`\n\n*Jika API tidak merespons, coba ganti Model, pastikan API Key benar, atau matikan ekstensi pengaman.*`;
                showToast("Gagal menerima stream data dari server.", "error");
            } finally {
                chat.messages[loadingMsgIndex].isTyping = false;
                saveChatsToStorage();
                toggleInputState(false); currentAbortController = null; 
                renderMessages(); // Final full render to attach action bar
            }
        }

        // V10 STREAMING LOGIC
        async function callAIAPI_Stream(messagesHistory, signal, msgIndex) {
            const cleanBaseUrl = appState.baseUrl.replace(/\/+$/, '');
            let apiUrl = `${cleanBaseUrl}/chat/completions`;
            let chat = getCurrentChat();
            
            const formattedMessages = messagesHistory.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text || '' }));
            if (appState.systemPersona) { formattedMessages.unshift({ role: "system", content: appState.systemPersona }); }

            const payload = { 
                model: appState.currentModel, 
                messages: formattedMessages, 
                temperature: parseFloat(appState.temperature),
                stream: true // Enable Streaming!
            };
            
            const reqHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.apiKey}` };

            const response = await fetch(apiUrl, { method: 'POST', headers: reqHeaders, body: JSON.stringify(payload), signal: signal });

            if (!response.ok) {
                let errMsg = `HTTP Status ${response.status}`;
                try { const errText = await response.text(); const errJson = JSON.parse(errText); errMsg = errJson.error?.message || errJson.message || errMsg; } catch(e) {}
                throw new Error(errMsg);
            }

            // Stream Reader
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let aiFullResponse = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n").filter(line => line.trim() !== "");
                
                for (const line of lines) {
                    const message = line.replace(/^data: /, "");
                    if (message === "[DONE]") return;
                    
                    try {
                        const parsed = JSON.parse(message);
                        const token = parsed.choices?.[0]?.delta?.content || "";
                        if (token) {
                            aiFullResponse += token;
                            chat.messages[msgIndex].text = aiFullResponse;
                            
                            // Throttle UI update using RequestAnimationFrame for buttery smooth typing
                            window.requestAnimationFrame(updateLastMessageUI);
                        }
                    } catch (e) {
                        // Silent ignore for non-JSON lines during stream
                    }
                }
            }
        }

        // --- 7. EVENT HANDLERS & UTILS ---
        function handleInputKeydown(e) { 
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 768) { 
                e.preventDefault(); if(!isGenerating) handleChatSubmit(e); 
            } 
        }
        
        function handleInputAutoResize(e) {
            const el = e.target; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; 
            const charCountEl = document.getElementById('charCount'); 
            if (charCountEl) charCountEl.innerText = `${el.value.length} chars`;
        }

        function saveSettings() {
            const elBaseUrl = document.getElementById('customBaseUrl');
            const elApiKey = document.getElementById('customApiKey');
            const elTempSlider = document.getElementById('tempSlider');
            const elSystemPersona = document.getElementById('systemPersonaInput');

            if (elBaseUrl) appState.baseUrl = elBaseUrl.value.trim();
            if (elApiKey) appState.apiKey = elApiKey.value.trim();
            if (elTempSlider) appState.temperature = parseFloat(elTempSlider.value);
            if (elSystemPersona) appState.systemPersona = elSystemPersona.value.trim();

            localStorage.setItem('akashiro_baseurl_v10', appState.baseUrl); 
            localStorage.setItem('akashiro_apikey_v10', appState.apiKey);
            localStorage.setItem('akashiro_temp_v10', appState.temperature); 
            localStorage.setItem('akashiro_persona_v10', appState.systemPersona);
            
            closeModal('settingsModal'); 
            showToast("Konfigurasi sistem berhasil disimpan.", "success");
        }

        function saveChatsToStorage() { localStorage.setItem('akashiro_chats_v10', JSON.stringify(appState.chats)); }
        
        function deleteChatSession(e, chatId) {
            if(e) e.stopPropagation(); 
            appState.chats = appState.chats.filter(c => c.id !== chatId);
            if (appState.currentChatId === chatId) appState.currentChatId = appState.chats[0]?.id || null;
            saveChatsToStorage(); renderChatHistory(); renderMessages(); updateHeaderTitle();
        }
        
        function clearAllChats() { 
            if(confirm("Hapus PERMANEN semua riwayat komputasi dari browser ini?")) {
                appState.chats = []; appState.currentChatId = null; 
                saveChatsToStorage(); renderChatHistory(); renderMessages(); updateHeaderTitle();
                showToast("Seluruh riwayat berhasil dibersihkan.");
            }
        }

        function exportCurrentChat(format) {
            const chat = getCurrentChat(); 
            if (!chat || chat.messages.length === 0) {
                showToast("Tidak ada data untuk diekspor.", "error"); return;
            }
            
            if(format === 'markdown') {
                let textData = `# AkaShiro Transkrip: ${chat.title}\nID: ${chat.id}\nTanggal: ${new Date().toLocaleString()}\nModel: ${chat.model}\n\n---\n\n`;
                chat.messages.forEach(m => { 
                    const roleName = m.role === 'user' ? 'USER' : 'AKASHIRO ENGINE';
                    textData += `### ${roleName} (${new Date(m.timestamp).toLocaleTimeString()})\n${m.text}\n\n---\n\n`; 
                });
                
                const blob = new Blob([textData], { type: 'text/markdown;charset=utf-8;' });
                const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
                a.download = `AkaShiro_${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                showToast("Transkrip Markdown berhasil diunduh.", "success");
            }
        }

        function openModal(id) { 
            const el = document.getElementById(id); const content = document.getElementById(id + 'Content');
            if (el) { el.classList.remove('hidden'); setTimeout(() => { if(content) {content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100');} }, 10); }
        }
        
        function closeModal(id) { 
            const el = document.getElementById(id); const content = document.getElementById(id + 'Content');
            if(content) { content.classList.remove('scale-100', 'opacity-100'); content.classList.add('scale-95', 'opacity-0'); }
            setTimeout(() => { if (el) el.classList.add('hidden'); }, 300);
        }
    </script>
